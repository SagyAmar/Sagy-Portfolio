    <style id="dark-theme">
/* ===== Dark mode ===== */
:root,:host{
  color-scheme:dark;
  --color-paper:#12100c;
  --color-surface:#1c1812;
  --color-ink:#f3ead6;
  --color-charcoal:#d6ccb6;
  --color-muted:#a1967f;
  --color-line:#352e21;
  --color-accent:#d9a93a;
  --color-accent-dark:#ecc45e;
  --color-accent-soft:#2b2312;
}
html{scrollbar-color:#3d3426 #12100c}
::selection{background:#d9a93a55;color:#fff}

/* surfaces */
.bg-white,.focus\:bg-white:focus{background-color:#17140f}
.to-white{--tw-gradient-to:#17140f}
.bg-paper\/90{background-color:rgba(18,16,12,.9)}
.card{box-shadow:0 1px 2px #00000040}
.card-hover:hover{border-color:#5e4d29;box-shadow:0 10px 28px #00000066}
[class*="shadow-[0_20px_50px"]{--tw-shadow:0 20px 50px #00000080}
dialog::backdrop{background-color:rgba(0,0,0,.72)!important}

/* formerly-dark elements: buttons, chips, icon tiles */
.btn-primary{background:var(--color-accent);color:#1a140a}
.btn-primary:hover{background:var(--color-accent-dark)}
.bg-ink{background-color:var(--color-accent)}
.border-ink{border-color:var(--color-accent)}
.bg-ink.text-white{color:#1a140a}
#thank-you{background-color:#0b0906;color:#f3ead6;border-top:1px solid var(--color-line)}

/* status colours readable on dark */
.text-red-700{color:#f28b82}
.text-emerald-700{color:#6fd3a5}
.border-red-500{border-color:#e5645b}
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
